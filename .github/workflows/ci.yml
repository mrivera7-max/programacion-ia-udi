name: CI

on: [push, pull_request]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Generar datos
        run: python generar_datos.py
      - name: Pruebas
        run: python -m pytest -q tests
      - name: Estilo (ruff)
        run: ruff check .
      - name: Tipado (mypy)
        run: mypy ej1_poo/cargadores.py monitoreo ej3_mensajes ej4_prioridad.py ej2_entrenamiento.py
